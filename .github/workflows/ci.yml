name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: infranoc_test
          POSTGRES_USER: infranoc
          POSTGRES_PASSWORD: infranoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infranoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pytest -v
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build
